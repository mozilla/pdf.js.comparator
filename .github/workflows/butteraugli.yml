name: Build butteraugli wasm

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-butteraugli.sh"
      - "scripts/build-deps.sh"
      - "scripts/resolve-upstream.mjs"
      - "src/butteraugli/**"
      - ".github/workflows/butteraugli.yml"
      - ".github/workflows/_renderer.yml"
  repository_dispatch:
    types: [butteraugli-head]
  schedule:
    - cron: "10 */4 * * *"
  workflow_dispatch:

# Default to no permissions; the reusable workflow's job below grants the
# narrow contents: write required by peaceiris/actions-gh-pages.
permissions: {}

concurrency:
  group: butteraugli-head
  cancel-in-progress: false

jobs:
  build:
    name: Build butteraugli
    permissions:
      contents: write # peaceiris/actions-gh-pages pushes to gh-pages
    uses: ./.github/workflows/_renderer.yml
    with:
      name: butteraugli
      target: butteraugli
      script: scripts/build-butteraugli.sh
      timeout: 30
      needs_emsdk: true
      resolver_env: |
        BUTTERAUGLI_REF=HEAD
