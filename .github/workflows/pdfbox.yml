name: Fetch pdfbox jar

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-pdfbox.sh"
      - "scripts/resolve-upstream.mjs"
      - ".github/workflows/pdfbox.yml"
      - ".github/workflows/_renderer.yml"
  repository_dispatch:
    types: [pdfbox-upstream]
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:

# Default to no permissions; the reusable workflow's job below grants the
# narrow contents: write required by the local publish-to-gh-pages action.
permissions: {}

concurrency:
  group: pdfbox-upstream
  cancel-in-progress: false

jobs:
  build:
    name: Fetch pdfbox
    permissions:
      contents: write # local publish-to-gh-pages action pushes to gh-pages
    uses: ./.github/workflows/_renderer.yml
    with:
      name: pdfbox
      target: pdfbox
      script: scripts/build-pdfbox.sh
      timeout: 20
      needs_java: true
