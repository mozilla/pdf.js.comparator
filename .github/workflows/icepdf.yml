name: Fetch ICEpdf jars

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-icepdf.sh"
      - "scripts/resolve-upstream.mjs"
      - ".github/workflows/icepdf.yml"
      - ".github/workflows/_renderer.yml"
  repository_dispatch:
    types: [icepdf-upstream]
  schedule:
    - cron: "25 */4 * * *"
  workflow_dispatch:

# Default to no permissions; the reusable workflow's job below grants the
# narrow contents: write required by peaceiris/actions-gh-pages.
permissions: {}

concurrency:
  group: icepdf-upstream
  cancel-in-progress: false

jobs:
  build:
    name: Fetch ICEpdf
    permissions:
      contents: write # peaceiris/actions-gh-pages pushes to gh-pages
    uses: ./.github/workflows/_renderer.yml
    with:
      name: icepdf
      target: icepdf
      script: scripts/build-icepdf.sh
      timeout: 30
      needs_java: true
