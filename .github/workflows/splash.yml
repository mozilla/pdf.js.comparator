name: Build splash wasm

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-splash.sh"
      - "scripts/build-deps.sh"
      - "src/splash/**"
      - "src/common/**"
      - "scripts/resolve-upstream.mjs"
      - ".github/workflows/splash.yml"
      - ".github/workflows/_renderer.yml"
  repository_dispatch:
    types: [splash-upstream]
  schedule:
    - cron: "55 */4 * * *"
  workflow_dispatch:

# Default to no permissions; the reusable workflow's job below grants the
# narrow contents: write required by the local publish-to-gh-pages action.
permissions: {}

concurrency:
  group: splash-upstream
  cancel-in-progress: false

jobs:
  build:
    name: Build splash
    permissions:
      contents: write # local publish-to-gh-pages action pushes to gh-pages
    uses: ./.github/workflows/_renderer.yml
    with:
      name: splash
      target: splash
      script: scripts/build-splash.sh
      timeout: 90
      needs_emsdk: true
      apt_packages: "cmake ninja-build meson pkg-config autoconf automake libtool gperf"
