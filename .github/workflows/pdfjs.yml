name: Build pdf.js dist

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-pdfjs.sh"
      - "scripts/build-deps.sh"
      - "scripts/resolve-upstream.mjs"
      - ".github/workflows/pdfjs.yml"
      - ".github/workflows/_renderer.yml"
  repository_dispatch:
    types: [pdfjs-master]
  schedule:
    - cron: "45 */4 * * *"
  workflow_dispatch:

# Default to no permissions; the reusable workflow's job below grants the
# narrow contents: write required by peaceiris/actions-gh-pages.
permissions: {}

concurrency:
  group: pdfjs-master
  cancel-in-progress: false

jobs:
  build:
    name: Build pdf.js
    permissions:
      contents: write # peaceiris/actions-gh-pages pushes to gh-pages
    uses: ./.github/workflows/_renderer.yml
    with:
      name: pdfjs
      target: pdfjs
      script: scripts/build-pdfjs.sh
      timeout: 60
      needs_node: true
      resolver_env: |
        PDFJS_REF=master
