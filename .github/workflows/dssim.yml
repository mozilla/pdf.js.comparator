name: Build dssim wasm

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-dssim.sh"
      - "scripts/resolve-upstream.mjs"
      - ".github/workflows/dssim.yml"
      - ".github/workflows/_renderer.yml"
  repository_dispatch:
    types: [dssim-upstream]
  schedule:
    - cron: "35 */4 * * *"
  workflow_dispatch:

# Default to no permissions; the reusable workflow's job below grants the
# narrow contents: write required by the local publish-to-gh-pages action.
permissions: {}

concurrency:
  group: dssim-upstream
  cancel-in-progress: false

jobs:
  build:
    name: Build dssim
    permissions:
      contents: write # local publish-to-gh-pages action pushes to gh-pages
    uses: ./.github/workflows/_renderer.yml
    with:
      name: dssim
      target: dssim
      script: scripts/build-dssim.sh
      timeout: 30
      needs_rust: true
      needs_wasm_pack: true
