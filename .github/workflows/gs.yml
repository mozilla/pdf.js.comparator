name: Fetch Ghostscript wasm

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-gs.sh"
      - "scripts/resolve-upstream.mjs"
      - ".github/workflows/gs.yml"
      - ".github/workflows/_renderer.yml"
  repository_dispatch:
    types: [gs-upstream]
  schedule:
    - cron: "5 */4 * * *"
  workflow_dispatch:

# Default to no permissions; the reusable workflow's job below grants the
# narrow contents: write required by peaceiris/actions-gh-pages.
permissions: {}

concurrency:
  group: gs-upstream
  cancel-in-progress: false

jobs:
  build:
    name: Fetch Ghostscript
    permissions:
      contents: write # peaceiris/actions-gh-pages pushes to gh-pages
    uses: ./.github/workflows/_renderer.yml
    with:
      name: gs
      target: gs
      script: scripts/build-gs.sh
      timeout: 15
