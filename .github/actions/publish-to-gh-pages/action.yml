#
# Local replacement for peaceiris/actions-gh-pages@... — Mozilla's GitHub
# enterprise policy only allows actions matching ./**. Reproduces the
# `keep_files: true` semantic: existing entries in the gh-pages branch are
# preserved, files under the destination subpath are overlaid with the
# source's contents.

name: Publish to gh-pages
description: |
  Overlay a directory onto the gh-pages branch under an optional destination
  subpath and push. Files already on gh-pages that are not in the source
  remain untouched (matches peaceiris/actions-gh-pages keep_files=true).

inputs:
  source:
    description: Path (workspace-relative) whose contents are published.
    required: true
  destination:
    description: Subpath within gh-pages to publish under. Empty = root.
    required: false
    default: ""
  github-token:
    description: Token with contents:write scope on the repository.
    required: true
  commit-message:
    description: Optional commit message override.
    required: false
    default: ""
  user-name:
    required: false
    default: "github-actions[bot]"
  user-email:
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"
  max-attempts:
    description: |
      How many times to retry on push rejection. Multiple per-renderer
      workflows can publish concurrently; the loser of each race rebases
      onto the new gh-pages tip and retries.
    required: false
    default: "8"

runs:
  using: composite
  steps:
    - name: Publish via git push
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        DEST: ${{ inputs.destination }}
        GH_TOKEN: ${{ inputs.github-token }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        GIT_USER_NAME: ${{ inputs.user-name }}
        GIT_USER_EMAIL: ${{ inputs.user-email }}
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
      run: |
        set -euo pipefail

        src="${GITHUB_WORKSPACE}/${SOURCE}"
        if [ ! -d "${src}" ]; then
          echo "source directory does not exist: ${src}" >&2
          exit 1
        fi

        push_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        worktree="$(mktemp -d)"
        msg="${COMMIT_MESSAGE:-Publish ${DEST:-site} from ${GITHUB_SHA}}"

        branch_exists() {
          git ls-remote --exit-code "${push_url}" refs/heads/gh-pages \
            >/dev/null 2>&1
        }

        # First-time bootstrap: create gh-pages as an empty orphan if the
        # remote branch doesn't exist yet. Subsequent runs go through the
        # retry loop below.
        if ! branch_exists; then
          git worktree add --detach --force "${worktree}" HEAD
          git -C "${worktree}" checkout --orphan gh-pages
          git -C "${worktree}" rm -rf . >/dev/null 2>&1 || true
        else
          # Fetch the current gh-pages tip into the worktree.
          git fetch --depth 1 "${push_url}" gh-pages
          git worktree add --force "${worktree}" FETCH_HEAD
          git -C "${worktree}" checkout -B gh-pages
        fi

        cd "${worktree}"
        git config user.name "${GIT_USER_NAME}"
        git config user.email "${GIT_USER_EMAIL}"

        # Resolve the target dir inside the worktree.
        target="${worktree}"
        if [ -n "${DEST}" ]; then
          target="${worktree}/${DEST}"
        fi

        apply_source() {
          mkdir -p "${target}"
          cp -R "${src}/." "${target}/"
          git add -A
        }

        attempt=0
        while :; do
          attempt=$((attempt + 1))
          apply_source
          if git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "${msg}"
          if git push "${push_url}" gh-pages; then
            echo "Published on attempt ${attempt}."
            exit 0
          fi

          if [ "${attempt}" -ge "${MAX_ATTEMPTS}" ]; then
            echo "Push still rejected after ${attempt} attempts; giving up." >&2
            exit 1
          fi

          # Lost the race against another publish to gh-pages. Refresh our
          # view of the branch and re-apply the source on top.
          sleep_for=$(((RANDOM % 6) + attempt))
          echo "Push rejected on attempt ${attempt}; refreshing in ${sleep_for}s and retrying."
          sleep "${sleep_for}"
          git fetch --depth 1 "${push_url}" gh-pages
          # Reset to the remote tip — discards the local commit we just
          # built so apply_source can re-stage on a clean base.
          git reset --hard FETCH_HEAD
        done
