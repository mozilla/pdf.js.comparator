<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>pdf.js.comparator harness</title>
    <!-- Inter is the body face; Zilla Slab Highlight is reserved for the
         "moz://a" wordmark in the top-left corner. preconnect cuts the
         font-fetch latency on first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Zilla+Slab+Highlight:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Firefox Photon-derived palette: warm off-white surface, ink
           foreground, Mozilla purple as the single accent. */
        --bg: #faf8f5;
        --bg-grad-1: #fbf3ec;
        --bg-grad-2: #f3edff;
        --surface: #ffffff;
        --surface-sunken: #f5f2ee;
        --ink: #15141a;
        --ink-2: #3a3944;
        --muted: #6e6e78;
        --border: #e7e3dd;
        --border-strong: #d2cec7;
        --accent: #9059ff;
        --accent-strong: #7c3aed;
        --accent-tint: rgba(144, 89, 255, 0.1);
        --accent-ring: rgba(144, 89, 255, 0.25);
        --warn: #ff9400;
        --error: #c8102e;
        --error-tint: rgba(200, 16, 46, 0.1);
        --ok: #058b00;

        --radius-sm: 6px;
        --radius: 10px;
        --radius-lg: 16px;
        --shadow-sm: 0 1px 2px rgba(20, 20, 30, 0.04);
        --shadow:
          0 1px 2px rgba(20, 20, 30, 0.04), 0 4px 12px rgba(20, 20, 30, 0.05);

        --mono:
          "JetBrains Mono", ui-monospace, "SF Mono", "Menlo", "Consolas",
          monospace;
        --sans:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
      }
      body {
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.5;
        color: var(--ink);
        margin: 0;
        padding: 4.5rem 1.5rem 3rem;
        /* Soft brand-gradient blob behind the hero. */
        background:
          radial-gradient(
            ellipse 60rem 32rem at 50% -10rem,
            var(--bg-grad-2) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 50rem 24rem at 90% -6rem,
            var(--bg-grad-1) 0%,
            transparent 55%
          ),
          var(--bg);
        background-repeat: no-repeat;

        &.drag-over::before {
          content: "";
          position: fixed;
          inset: 1rem;
          border: 2px dashed var(--accent);
          border-radius: var(--radius-lg);
          background: rgba(255, 255, 255, 0.6);
          pointer-events: none;
          z-index: 1000;
        }
      }

      /* Mozilla "moz://a" wordmark in the top-left corner. Renders with
         Zilla Slab Highlight, the slab serif Mozilla's wordmark uses. */
      .moz-corner {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 100;
        font-family: "Zilla Slab Highlight", "Zilla Slab", serif;
        font-weight: 700;
        font-size: 1.5rem;
        line-height: 1;
        color: var(--ink);
        text-decoration: none;
        padding: 0.35rem 0.6rem;
        border-radius: var(--radius-sm);
        transition:
          background 0.15s ease,
          transform 0.15s ease;
      }
      .moz-corner:hover,
      .moz-corner:focus-visible {
        background: rgba(0, 0, 0, 0.06);
        outline: none;
        transform: translateY(-1px);
      }

      .github-corner {
        position: fixed;
        top: 1rem;
        right: 1rem;
        z-index: 100;
        color: var(--ink-2);
        display: inline-flex;
        padding: 0.45rem;
        border-radius: 999px;
        text-decoration: none;
        transition:
          background 0.15s ease,
          color 0.15s ease,
          transform 0.15s ease;
      }
      .github-corner:hover,
      .github-corner:focus-visible {
        background: rgba(0, 0, 0, 0.06);
        color: var(--accent);
        outline: none;
        transform: translateY(-1px);
      }

      /* ── hero ───────────────────────────────────────────────────────── */
      .hero {
        max-width: 80rem;
        margin: 0 auto 2rem;
        padding: 0 0.25rem;
      }
      .hero h1 {
        font-size: clamp(1.75rem, 3.5vw, 2.5rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin: 0 0 0.5rem;
      }
      .hero h1 .accent {
        background: linear-gradient(
          135deg,
          var(--accent) 0%,
          #ff7139 70%,
          #ffa436 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hero .lede {
        margin: 0;
        max-width: 56rem;
        font-size: 1rem;
        color: var(--muted);
      }

      /* ── controls ───────────────────────────────────────────────────── */
      .controls {
        max-width: 80rem;
        margin: 0 auto;
        display: grid;
        gap: 1rem;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
      .controls .card-drop,
      .controls .card-wide {
        grid-column: 1 / -1;
      }
      @media (max-width: 56rem) {
        .controls {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1.1rem 1.25rem 1.25rem;
        box-shadow: var(--shadow-sm);
      }
      .card-title {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 0 0 0.85rem;
      }

      /* file drop zone — visually obvious target since drag-and-drop is
         the harness's primary entry point */
      .dropzone {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        padding: 1.5rem 1rem;
        border: 1.5px dashed var(--border-strong);
        border-radius: var(--radius);
        background: var(--surface-sunken);
        color: var(--muted);
        cursor: pointer;
        text-align: center;
        transition:
          border-color 0.15s ease,
          background 0.15s ease,
          color 0.15s ease;
      }
      .dropzone:hover,
      .dropzone:focus-within {
        border-color: var(--accent);
        background: var(--accent-tint);
        color: var(--ink);
      }
      .dropzone-icon {
        font-size: 1.5rem;
        line-height: 1;
        color: var(--accent);
      }
      .dropzone-text {
        font-size: 0.95rem;
      }
      .dropzone-text strong {
        color: var(--accent-strong);
        font-weight: 600;
      }
      .dropzone-hint {
        font-size: 0.8rem;
        color: var(--muted);
        font-family: var(--mono);
      }
      /* hide the native file input but keep it interactive over the zone */
      .dropzone input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: inherit;
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr));
        gap: 0.85rem 1rem;
        align-items: end;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        min-width: 0;
      }
      .field-label {
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .field-hint {
        font-size: 0.78rem;
        color: var(--muted);
        font-family: var(--mono);
      }

      input[type="number"],
      select {
        width: 100%;
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        padding: 0.45rem 0.65rem;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      input[type="number"]:hover,
      select:hover {
        border-color: var(--ink-2);
      }
      input[type="number"]:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-ring);
      }
      select {
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--muted) 50%),
          linear-gradient(135deg, var(--muted) 50%, transparent 50%);
        background-position:
          calc(100% - 0.95rem) 50%,
          calc(100% - 0.55rem) 50%;
        background-size:
          5px 5px,
          5px 5px;
        background-repeat: no-repeat;
        padding-right: 1.6rem;
      }

      /* toggle (custom checkbox) — used for antialias / transparent */
      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        font-size: 0.9rem;
        user-select: none;
      }
      .toggle input[type="checkbox"] {
        appearance: none;
        width: 1.05rem;
        height: 1.05rem;
        border: 1.5px solid var(--border-strong);
        border-radius: 4px;
        background: var(--surface);
        cursor: pointer;
        flex-shrink: 0;
        position: relative;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }
      .toggle input[type="checkbox"]:hover {
        border-color: var(--ink-2);
      }
      .toggle input[type="checkbox"]:checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      .toggle input[type="checkbox"]:checked::after {
        content: "";
        position: absolute;
        left: 3px;
        top: 0;
        width: 5px;
        height: 9px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }
      .toggle input[type="checkbox"]:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--accent-ring);
      }

      /* renderer chips — pill checkboxes with per-engine accent dot */
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.35rem 0.75rem 0.35rem 0.6rem;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        border-radius: 999px;
        font-size: 0.85rem;
        font-family: var(--mono);
        color: var(--ink-2);
        cursor: pointer;
        user-select: none;
        transition:
          border-color 0.15s ease,
          background 0.15s ease,
          color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .chip:hover {
        border-color: var(--ink-2);
      }
      .chip input[type="checkbox"] {
        appearance: none;
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 50%;
        background: var(--border-strong);
        margin: 0;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .chip:has(input:checked) {
        border-color: var(--accent);
        background: var(--accent-tint);
        color: var(--ink);
      }
      .chip:has(input:checked) input[type="checkbox"] {
        background: var(--engine, var(--accent));
        box-shadow: 0 0 0 2px var(--accent-tint);
      }
      .chip:has(input:focus-visible) {
        box-shadow: 0 0 0 3px var(--accent-ring);
      }
      .chip[data-engine="cairo"] {
        --engine: #ff7139;
      }
      .chip[data-engine="splash"] {
        --engine: #ffa436;
      }
      .chip[data-engine="pdfium"] {
        --engine: #4285f4;
      }
      .chip[data-engine="mupdf"] {
        --engine: #d9434c;
      }
      .chip[data-engine="pdfjs"] {
        --engine: #9059ff;
      }
      .chip[data-engine="pdfbox"] {
        --engine: #00b287;
      }
      .chip[data-engine="gs"] {
        --engine: #6a737d;
      }
      .chip[data-engine="xpdf"] {
        --engine: #b16cea;
      }
      .chip[data-engine="icepdf"] {
        --engine: #00a4dc;
      }

      /* ── status pill ────────────────────────────────────────────────── */
      .status-wrap {
        max-width: 80rem;
        margin: 1.25rem auto 0;
      }
      #status {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        font-family: var(--mono);
        font-size: 0.82rem;
        color: var(--ink-2);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.35rem 0.9rem 0.35rem 0.7rem;
        min-height: 1.6rem;
        box-shadow: var(--shadow-sm);

        &::before {
          content: "";
          width: 0.5rem;
          height: 0.5rem;
          border-radius: 50%;
          background: var(--accent);
          box-shadow: 0 0 0 3px var(--accent-tint);
          flex-shrink: 0;
          animation: status-pulse 1.6s ease-in-out infinite;
        }
        &.err {
          color: var(--error);
          background: var(--error-tint);
          border-color: rgba(200, 16, 46, 0.3);
        }
        &.err::before {
          background: var(--error);
          box-shadow: 0 0 0 3px var(--error-tint);
          animation: none;
        }
      }
      @keyframes status-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* ── renders grid ───────────────────────────────────────────────── */
      #renders {
        max-width: 80rem;
        margin: 1.5rem auto 0;
        display: flex;
        flex-wrap: wrap;
        gap: 1.25rem;
        align-items: flex-start;

        & > .render {
          flex: 0 1 auto;
          max-width: 100%;
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          gap: 0.5rem;
          padding: 0.85rem;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          box-shadow: var(--shadow-sm);
          transition: box-shadow 0.2s ease;

          &:hover {
            box-shadow: var(--shadow);
          }

          & > h3 {
            margin: 0;
            font-size: 0.78rem;
            font-family: var(--mono);
            font-weight: 500;
            color: var(--ink-2);
            letter-spacing: 0.01em;
          }
        }
      }

      .canvas-wrap {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: repeating-conic-gradient(#eeeae5 0% 25%, #fff 0% 50%) 50% /
          16px 16px;
        width: fit-content;
        max-width: 100%;
        overflow: auto;

        & > canvas {
          display: block;
        }
      }

      /* skeleton/failed render slots ─ shown per renderer during render */
      .render-row {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
      }
      #renders > .render.skeleton .canvas-wrap,
      #renders > .render.failed .canvas-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface-sunken);
        border-style: dashed;
        border-color: var(--border-strong);
        min-width: 11rem;
        min-height: 7.5rem;
        padding: 1rem;
        font-family: var(--mono);
        font-size: 0.78rem;
        color: var(--muted);
        text-align: center;
        overflow: hidden;
      }
      #renders > .render.skeleton {
        animation: skeleton-pulse 1.6s ease-in-out infinite;
      }
      #renders > .render.failed .canvas-wrap {
        color: var(--error);
        background: var(--error-tint);
        border-color: rgba(200, 16, 46, 0.35);
      }
      .spinner {
        width: 0.9rem;
        height: 0.9rem;
        border: 2px solid var(--border-strong);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes skeleton-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.65;
        }
      }

      /* ── diffs ──────────────────────────────────────────────────────── */
      #diffs {
        max-width: 80rem;
        margin: 1.5rem auto 0;

        & .pair {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--radius-lg);
          padding: 1rem 1.25rem 1.25rem;
          margin-bottom: 1.25rem;
          box-shadow: var(--shadow-sm);

          & > h2 {
            margin: 0 0 0.85rem;
            font-size: 0.9rem;
            font-family: var(--mono);
            font-weight: 600;
            color: var(--ink);
          }

          & .pair-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;

            & > .diff {
              flex: 0 1 auto;
              max-width: 100%;
              display: flex;
              flex-direction: column;
              align-items: flex-start;
              gap: 0.35rem;
              font-family: var(--mono);
              font-size: 0.78rem;
              color: var(--muted);
              padding: 0.75rem;
              background: var(--surface-sunken);
              border-radius: var(--radius-sm);

              & > h3 {
                margin: 0;
                font-size: 0.78rem;
                font-weight: 600;
                color: var(--ink);
              }
            }
          }
        }
      }

      .diff-info,
      .diff-note {
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .diff-info {
        color: var(--muted);
      }

      .diff-note {
        color: var(--error);
      }

      .diff-image {
        display: block;
        border: 1px solid var(--border);
        border-radius: 4px;
      }

      .diff-progress {
        position: relative;
        height: 4px;
        background: var(--surface-sunken);
        border-radius: 999px;
        overflow: hidden;
        margin: 0 0 1rem;
      }
      .diff-progress-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: linear-gradient(
          90deg,
          var(--accent) 0%,
          #ff7139 70%,
          #ffa436 100%
        );
        border-radius: inherit;
        transition: width 0.2s ease;
      }
      .diff-progress.done {
        opacity: 0;
        transition: opacity 0.4s ease 0.25s;
      }

      #diffs .pair-row > .diff.loading,
      #diffs .pair-row > .diff.failed {
        min-width: 9rem;
      }
      #diffs .pair-row > .diff.loading {
        animation: skeleton-pulse 1.6s ease-in-out infinite;
      }
      .diff-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 9rem;
        min-height: 4.5rem;
        padding: 0.75rem;
        border: 1px dashed var(--border-strong);
        border-radius: 4px;
        background: var(--surface);
        color: var(--muted);
        font-size: 0.78rem;
        font-family: var(--mono);
        text-align: center;
      }
      #diffs .pair-row > .diff.failed .diff-placeholder {
        color: var(--error);
        background: var(--error-tint);
        border-color: rgba(200, 16, 46, 0.35);
      }

      .ssim-readout {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        font-weight: 600;
        font-family: var(--mono);
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0.75rem 1rem;
        min-width: 9rem;
      }
    </style>
  </head>
  <body>
    <a
      class="moz-corner"
      href="https://www.mozilla.org"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Mozilla"
      title="mozilla.org"
      >moz://a</a
    >
    <a
      class="github-corner"
      href="https://github.com/mozilla/pdf.js.comparator"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="View source on GitHub"
      title="View source on GitHub"
    >
      <!-- Octicons mark-github, MIT-licensed. -->
      <svg
        viewBox="0 0 16 16"
        width="28"
        height="28"
        fill="currentColor"
        aria-hidden="true"
      >
        <path
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
        ></path>
      </svg>
    </a>
    <header class="hero">
      <h1>pdf.js<span class="accent">.comparator</span></h1>
      <p class="lede">
        Render the same PDF page through pdf.js and reference engines
        side-by-side, then diff the bitmaps with six image-similarity algorithms
        — all in your browser.
      </p>
    </header>

    <main class="controls">
      <section class="card card-drop" aria-labelledby="card-doc">
        <h2 id="card-doc" class="card-title">Document</h2>
        <label class="dropzone">
          <span class="dropzone-icon" aria-hidden="true">⬆</span>
          <span class="dropzone-text"
            >Drop a PDF here or <strong>click to browse</strong></span
          >
          <span class="dropzone-hint">accepts application/pdf</span>
          <input type="file" id="file" accept="application/pdf,.pdf" disabled />
        </label>
      </section>

      <section class="card" aria-labelledby="card-page">
        <h2 id="card-page" class="card-title">Page &amp; options</h2>
        <div class="field-grid">
          <label class="field">
            <span class="field-label">Page</span>
            <input type="number" id="page" value="1" min="1" step="1" />
            <span id="pages" class="field-hint"></span>

              <option value="pdfium">pdfium</option>

            <span class="field-label">To</span>

              <option value="cairo">cairo</option>
              <option value="splash">splash</option>
              <option value="pdfium" selected>pdfium</option>
              <option value="mupdf">mupdf</option>
              <option value="pdfjs">pdf.js</option>
              <option value="pdfbox">pdfbox</option>
              <option value="gs">gs</option>
              <option value="xpdf">xpdf</option>
              <option value="icepdf">icepdf</option>
            </select>

      <section class="card card-wide" aria-labelledby="card-rend">
        <h2 id="card-rend" class="card-title">Renderers</h2>
        <div class="chip-row">
          <label class="chip" data-engine="cairo"
            ><input
              type="checkbox"
              class="renderer"
              value="cairo"
              checked
            /><span>cairo</span></label
          >
          <label class="chip" data-engine="splash"
            ><input
              type="checkbox"
              class="renderer"
              value="splash"
              checked
            /><span>splash</span></label
          >
          <label class="chip" data-engine="pdfium"
            ><input
              type="checkbox"
              class="renderer"
              value="pdfium"
              checked
            /><span>pdfium</span></label
          >
          <label class="chip" data-engine="mupdf"
            ><input
              type="checkbox"
              class="renderer"
              value="mupdf"
              checked
            /><span>mupdf</span></label
          >
          <label class="chip" data-engine="pdfjs"
            ><input
              type="checkbox"
              class="renderer"
              value="pdfjs"
              checked
            /><span>pdf.js</span></label
          >
          <label class="chip" data-engine="pdfbox"
            ><input
              type="checkbox"
              class="renderer"
              value="pdfbox"
              checked
            /><span>pdfbox</span></label
          >
          <label class="chip" data-engine="gs"
            ><input type="checkbox" class="renderer" value="gs" checked /><span
              >ghostscript</span
            ></label
          >
          <label class="chip" data-engine="xpdf"
            ><input
              type="checkbox"
              class="renderer"
              value="xpdf"
              checked
            /><span>xpdf</span></label
          >
          <label class="chip" data-engine="icepdf"

              type="checkbox"
              class="renderer"
              value="icepdf"

    </main>

    <div class="status-wrap">
      <div id="status" role="status" aria-live="polite">loading wasm…</div>
    </div>
    <div id="renders"></div>
    <div id="diffs"></div>

    <script type="module">
      // Browser-friendly diff libraries. The heavier wasm diffs run in
      // workers so they don't block page rendering.
      import pixelmatch from "https://esm.sh/pixelmatch@7";
      import resemble from "https://esm.sh/resemblejs@5";
      import { ssim } from "https://esm.sh/ssim.js@3";

      // Minimal request/response wrapper around worker messages.
      const spawn = (url, { module = true } = {}) => {
        const worker = new Worker(url, module ? { type: "module" } : undefined);
        const pending = new Map();
        let resolveReady, rejectReady;
        const ready = new Promise((res, rej) => {
          resolveReady = res;
          rejectReady = rej;
        });
        // Lazy workers may fail before anyone awaits `ready`.
        ready.catch(() => {});
        worker.addEventListener("message", (e) => {
          if (e.data.type === "ready") {
            resolveReady();
            return;
          }
          if (e.data.type === "init-error") {
            rejectReady(new Error(e.data.error));
            return;
          }
          const { id, payload, error } = e.data;
          const cb = pending.get(id);
          if (!cb) return;
          pending.delete(id);
          if (error) cb.reject(new Error(error));
          else cb.resolve(payload);
        });
        worker.addEventListener("error", (e) => {
          const err = e.error || new Error(e.message || "worker error");
          // Reject `ready` (no-op if already settled) and every in-flight
          // call. Without this, runtime worker errors leave pending calls
          // hanging forever — the renderer cards never resolve.
          rejectReady(err);
          for (const { reject } of pending.values()) reject(err);
          pending.clear();
        });
        return {
          ready,
          call: async (type, payload, transfers = []) => {
            await ready; // throws if init failed; caller catches it
            return new Promise((resolve, reject) => {
              const id = crypto.randomUUID();
              pending.set(id, { resolve, reject });
              worker.postMessage({ id, type, payload }, transfers);
            });
          },
        };
      };

      // Absolute base URL for wasm/pdf.js artifacts. Override with ?base=URL.
      const BASE = new URL(
        new URL(window.location.href).searchParams.get("base") || "./out",
        window.location.href,
      ).href;
      const WORKER_VERSION = "2026-05-11-java-error-iife";
      const withVersion = (href, version) => {
        const url = new URL(href, window.location.href);
        url.searchParams.set("v", version);
        return url.href;
      };
      const artifactVersion = async (name) => {
        try {
          const url = new URL(
            `${BASE}/${name}/source.json`,
            window.location.href,
          );
          url.searchParams.set("t", Date.now());
          const response = await fetch(url.href, { cache: "no-store" });
          if (response.ok) {
            const source = await response.json();
            return (
              source.fingerprint ||
              source.commit ||
              source.version ||
              WORKER_VERSION
            );
          }
        } catch {
          // Older local builds may not have source.json files.
        }
        return WORKER_VERSION;
      };
      // Cache the per-renderer fingerprint so each spawned worker can load
      // a wasm bundle that matches the source.json currently on disk —
      // bumping a renderer publish busts only that renderer's cache.
      const artifactVersionCache = new Map();
      const cachedArtifactVersion = (name) => {
        if (!artifactVersionCache.has(name)) {
          artifactVersionCache.set(name, artifactVersion(name));
        }
        return artifactVersionCache.get(name);
      };
      const workerUrl = (script, params = {}, version = WORKER_VERSION) =>
        `./workers/${script}?${new URLSearchParams({
          ...params,
          base: BASE,
          v: version,
        })}`;

      // Keep the pdf.js main module and worker from the same build.
      const PDFJS_BASE = `${BASE}/pdfjs`;
      const PDFJS_VERSION = await artifactVersion("pdfjs");
      const pdfjsLib = await import(
        withVersion(`${PDFJS_BASE}/pdf.mjs`, PDFJS_VERSION)
      );
      pdfjsLib.GlobalWorkerOptions.workerSrc = withVersion(
        `${PDFJS_BASE}/pdf.worker.mjs`,
        PDFJS_VERSION,
      );

      // Renderer workers are spawned lazily, one instance per engine.
      // Each worker's URL embeds both the worker-code version (so editing
      // workers/*.js busts the cache) and the per-renderer artifact
      // fingerprint (so republishing the wasm busts it too). The combined
      // string flows through to the worker's inner imports — wasm modules,
      // render-result-transport.js, java-error.js — so they all invalidate
      // together when either source changes.
      const CLI_RENDERERS = ["gs", "xpdf"];
      const workerVersionFor = async (name) =>
        `${WORKER_VERSION}-${await cachedArtifactVersion(name)}`;
      const namedWorkerGetter = (script, rendererParam, workerOptions = {}) => {
        const cache = new Map();
        return (name) => {
          if (!cache.has(name)) {
            cache.set(
              name,
              (async () =>
                spawn(
                  workerUrl(
                    script,
                    { [rendererParam]: name },
                    await workerVersionFor(name),
                  ),
                  workerOptions,
                ))(),
            );
          }
          return cache.get(name);
        };
      };
      const getRendererWorker = namedWorkerGetter("renderer-worker.js", "wasm");
      const getCliRendererWorker = namedWorkerGetter(
        "cli-renderer-worker.js",
        "renderer",
      );

      // CheerpJ workers are classic workers, not ES module workers.
      let pdfboxWorker = null;
      const getPdfboxWorker = async () => {
        if (!pdfboxWorker) {
          pdfboxWorker = spawn(
            workerUrl("pdfbox-worker.js", {}, await workerVersionFor("pdfbox")),
            { module: false },
          );
        }
        return pdfboxWorker;
      };
      let icepdfWorker = null;
      const getIcepdfWorker = async () => {
        if (!icepdfWorker) {
          icepdfWorker = spawn(
            workerUrl("icepdf-worker.js", {}, await workerVersionFor("icepdf")),
            { module: false },
          );
        }
        return icepdfWorker;
      };
      const DIFF_WASMS = ["butteraugli", "dssim", "flip"];
      const diffWorkers = Object.fromEntries(
        await Promise.all(
          DIFF_WASMS.map(async (name) => [
            name,
            spawn(
              workerUrl(
                "diff-worker.js",
                { wasm: name },
                await workerVersionFor(name),
              ),
            ),
          ]),
        ),
      );

      const $ = (id) => document.getElementById(id);
      const $$ = (sel) => Array.from(document.querySelectorAll(sel));
      const dom = {
        antialias: $("antialias"),
        compareA: $("compare-a"),
        compareB: $("compare-b"),
        diffs: $("diffs"),
        dpi: $("dpi"),
        file: $("file"),
        page: $("page"),
        pages: $("pages"),
        renders: $("renders"),
        status: $("status"),
        transparent: $("transparent"),
      };

      const el = (tag, className = "", text = "") => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== "") node.textContent = text;
        return node;
      };
      const setStatus = (msg, err = false) => {
        dom.status.textContent = msg;
        dom.status.classList.toggle("err", err);
      };
      const errorMessage = (err) => err?.message || String(err);
      const clearOutput = () => {
        dom.renders.replaceChildren();
        dom.diffs.replaceChildren();
      };
      const setDisplaySize = (node, width, height, dpr) => {
        node.style.width = `${width / dpr}px`;
        node.style.height = `${height / dpr}px`;
      };
      const createCanvas = (width, height, dpr) => {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        setDisplaySize(canvas, width, height, dpr);
        return canvas;
      };
      const wrapCanvas = (canvas) => {
        const wrap = el("div", "canvas-wrap");
        wrap.appendChild(canvas);
        return wrap;
      };

      // Per-renderer placeholder cards. Reserved when a render starts so the
      // user sees one slot per selected engine (with a spinner) instead of
      // a blank area, then swapped in-place as each engine finishes — or
      // flipped to a failed state when its worker rejects.
      const renderSlots = new Map();
      const createRenderSlots = (names) => {
        renderSlots.clear();
        dom.renders.replaceChildren();
        for (const name of names) {
          const card = el("div", "render skeleton");
          card.dataset.renderer = name;
          const h3 = el("h3");
          const row = el("span", "render-row");
          row.appendChild(el("span", "spinner"));
          row.appendChild(document.createTextNode(rendererLabel(name)));
          h3.appendChild(row);
          card.appendChild(h3);
          const wrap = el("div", "canvas-wrap", "loading…");
          card.appendChild(wrap);
          dom.renders.appendChild(card);
          renderSlots.set(name, card);
        }
      };
      const fillRenderSlot = (name, h3Text, canvas) => {
        let slot = renderSlots.get(name);
        if (!slot) {
          slot = el("div", "render");
          slot.dataset.renderer = name;
          dom.renders.appendChild(slot);
          renderSlots.set(name, slot);
        }
        slot.classList.remove("skeleton", "failed");
        slot.replaceChildren(el("h3", "", h3Text), wrapCanvas(canvas));
      };
      const failRenderSlot = (name, err) => {
        const slot = renderSlots.get(name);
        if (!slot) return;
        slot.classList.remove("skeleton");
        slot.classList.add("failed");
        slot.replaceChildren(
          el("h3", "", `${rendererLabel(name)} — failed`),
          el("div", "canvas-wrap", errorMessage(err)),
        );
      };

      const pdfjsDocumentOptions = (data) => ({
        data,
        verbosity: 0,
        // Use the same auxiliary data a production pdf.js viewer would.
        wasmUrl: `${PDFJS_BASE}/wasm/`,
        cMapUrl: `${PDFJS_BASE}/cmaps/`,
        cMapPacked: true,
        standardFontDataUrl: `${PDFJS_BASE}/standard_fonts/`,
        iccUrl: `${PDFJS_BASE}/iccs/`,
      });

      const openPdfjsDocument = async (data) => {
        const loadingTask = pdfjsLib.getDocument(pdfjsDocumentOptions(data));
        try {
          return {
            doc: await loadingTask.promise,
            loadingTask,
          };
        } catch (err) {
          if (typeof loadingTask.destroy === "function") {
            await loadingTask.destroy();
          }
          throw err;
        }
      };

      const destroyPdfjsDocument = async (doc, loadingTask) => {
        if (typeof doc.destroy === "function") {
          await doc.destroy();
        } else if (typeof loadingTask?.destroy === "function") {
          await loadingTask.destroy();
        } else if (typeof doc.cleanup === "function") {
          await doc.cleanup();
        }
      };

      const getPdfjsPageCount = async (sourcePdfBytes) => {
        const dataCopy = sourcePdfBytes.slice();
        const { doc, loadingTask } = await openPdfjsDocument(dataCopy);
        try {
          return doc.numPages || 0;
        } finally {
          await destroyPdfjsDocument(doc, loadingTask);
        }
      };

      const renderPdfjsAfterOperatorList = async (pdfPage, renderParams) => {
        const originalRenderPageChunk = pdfPage._renderPageChunk;
        if (typeof originalRenderPageChunk !== "function") {
          await pdfPage.render(renderParams).promise;
          return;
        }

        let operatorListComplete = false;
        let pendingContinue = null;
        const flushPendingContinue = () => {
          if (!operatorListComplete || !pendingContinue) {
            return;
          }
          const continueRendering = pendingContinue;
          pendingContinue = null;
          continueRendering();
        };

        // For stable captures, wait for the full operator list before drawing.
        pdfPage._renderPageChunk = function (operatorListChunk, intentState) {
          if (operatorListChunk?.lastChunk) {
            try {
              return originalRenderPageChunk.call(
                this,
                operatorListChunk,
                intentState,
              );
            } finally {
              operatorListComplete = true;
              flushPendingContinue();
            }
          }

          const renderTasks = intentState?.renderTasks;
          if (!renderTasks?.size) {
            return originalRenderPageChunk.call(
              this,
              operatorListChunk,
              intentState,
            );
          }

          intentState.renderTasks = new Set();
          try {
            return originalRenderPageChunk.call(
              this,
              operatorListChunk,
              intentState,
            );
          } finally {
            intentState.renderTasks = renderTasks;
          }
        };

        try {
          const renderTask = pdfPage.render(renderParams);
          renderTask.onContinue = (continueRendering) => {
            if (operatorListComplete) {
              continueRendering();
              return;
            }
            pendingContinue = continueRendering;
          };
          await renderTask.promise;
        } finally {
          pdfPage._renderPageChunk = originalRenderPageChunk;
        }
      };

      const renderPdfjs = async (pdfBytes, page, dpi, transparent) => {
        // pdf.js transfers and detaches its input buffer.
        const dataCopy = pdfBytes.slice();
        const { doc, loadingTask } = await openPdfjsDocument(dataCopy);
        try {
          const pdfPage = await doc.getPage(page);
          const viewport = pdfPage.getViewport({ scale: dpi / 72 });
          const canvas = document.createElement("canvas");
          canvas.width = Math.ceil(viewport.width);
          canvas.height = Math.ceil(viewport.height);
          const ctx = canvas.getContext("2d");
          if (!transparent) {
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
          await renderPdfjsAfterOperatorList(pdfPage, {
            canvasContext: ctx,
            viewport,
            canvas,
          });
          const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const view = pdfPage.view; // [x1, y1, x2, y2] in pt
          return {
            renderer: "pdfjs",
            width: canvas.width,
            height: canvas.height,
            data: img.data,
            page_width_pt: view[2] - view[0],
            page_height_pt: view[3] - view[1],
          };
        } finally {
          await destroyPdfjsDocument(doc, loadingTask);
        }
      };

      // Main-thread diff backends. Wasm diffs use `runWasmDiffs`.
      const COMPARATORS = [
        {
          name: "pixelmatch",
          run: (a, b) => {
            const { width, height } = a;
            const diff = new Uint8ClampedArray(width * height * 4);
            const n = pixelmatch(a.data, b.data, diff, width, height, {
              threshold: 0.1,
              includeAA: false,
            });
            const pct = ((n / (width * height)) * 100).toFixed(2);
            return { label: `${n} px diff (${pct}%)`, diffPixels: diff };
          },
        },
        {
          name: "resemblejs",
          run: (a, b) =>
            new Promise((resolve) => {
              const ia = new ImageData(a.data, a.width, a.height);
              const ib = new ImageData(b.data, b.width, b.height);
              resemble(ia)
                .compareTo(ib)
                .ignoreAntialiasing()
                .onComplete((d) => {
                  resolve({
                    label: `${parseFloat(d.misMatchPercentage).toFixed(2)}% mismatch`,
                    diffURL: d.getImageDataUrl(),
                  });
                });
            }),
        },
        {
          name: "ssim.js",
          run: (a, b) => {
            const r = ssim(
              { width: a.width, height: a.height, data: a.data },
              { width: b.width, height: b.height, data: b.data },
            );
            return { label: `MSSIM = ${r.mssim.toFixed(4)}` };
          },
        },
      ];

      // Each wasm diff gets its own transferable copy of the image pair.
      const runWasmDiffs = async (a, b) => {
        const cloneImg = (i) => ({
          renderer: i.renderer,
          width: i.width,
          height: i.height,
          data: new Uint8ClampedArray(i.data),
        });
        const results = await Promise.allSettled(
          DIFF_WASMS.map(async (name) => {
            const aCopy = cloneImg(a);
            const bCopy = cloneImg(b);
            return diffWorkers[name].call("diff", { a: aCopy, b: bCopy }, [
              aCopy.data.buffer,
              bCopy.data.buffer,
            ]);
          }),
        );
        return results.map((result, index) => {
          if (result.status === "fulfilled") {
            return result.value;
          }
          return {
            name: DIFF_WASMS[index],
            error: result.reason?.message || String(result.reason),
          };
        });
      };

      const rendererLabel = (name) => (name === "pdfjs" ? "pdf.js" : name);
      const rendererSummary = (images) =>
        images
          .map((img) => `${img.renderer} ${img.width}×${img.height}`)
          .join(" + ");

      const appendDiffMessage = (pair, className, text) => {
        pair.appendChild(el("div", className, text));
      };

      const cropImage = (img, width, height) => {
        if (img.width === width && img.height === height) {
          return img;
        }
        const data = new Uint8ClampedArray(width * height * 4);
        const rowBytes = width * 4;
        for (let y = 0; y < height; y++) {
          const srcStart = y * img.width * 4;
          data.set(
            img.data.subarray(srcStart, srcStart + rowBytes),
            y * rowBytes,
          );
        }
        return { ...img, width, height, data };
      };

      // Tiny dimension differences are usually renderer rounding noise.
      const renderDiffs = async (
        images,
        dpr,
        myGen,
        myDiffGen,
        compareA,
        compareB,
      ) => {
        if (staleDiff(myGen, myDiffGen)) return;
        dom.diffs.replaceChildren();

        const pair = el("div", "pair");
        pair.appendChild(
          el(
            "h2",
            "",
            `${rendererLabel(compareA)} ↔ ${rendererLabel(compareB)}`,
          ),
        );
        dom.diffs.appendChild(pair);

        if (compareA === compareB) {
          appendDiffMessage(
            pair,
            "diff-note",
            "skipped — pick two different renderers",
          );
          return;
        }

        let a = images.find((img) => img.renderer === compareA);
        let b = images.find((img) => img.renderer === compareB);
        if (!a || !b) {
          const missing = [!a ? compareA : null, !b ? compareB : null]
            .filter(Boolean)
            .map(rendererLabel);
          appendDiffMessage(
            pair,
            "diff-note",
            `skipped — renderer not available: ${missing.join(", ")}`,
          );
          return;
        }

        if (a.width !== b.width || a.height !== b.height) {
          const widthDelta = Math.abs(a.width - b.width);
          const heightDelta = Math.abs(a.height - b.height);
          if (widthDelta > 2 || heightDelta > 2) {
            appendDiffMessage(
              pair,
              "diff-note",
              `skipped — dimensions differ (${a.width}×${a.height} vs ${b.width}×${b.height})`,
            );
            return;
          }

          const width = Math.min(a.width, b.width);
          const height = Math.min(a.height, b.height);
          appendDiffMessage(
            pair,
            "diff-info",
            `cropped to ${width}×${height} for diff (${a.width}×${a.height} vs ${b.width}×${b.height})`,
          );
          a = cropImage(a, width, height);
          b = cropImage(b, width, height);
        }

        const row = el("div", "pair-row");
        pair.appendChild(row);

        const resetCard = (card, name) => {
          card.classList.remove("loading", "failed");
          card.replaceChildren(el("h3", "", name));
        };
        const loadingCard = (card, name) => {
          card.classList.remove("failed");
          card.classList.add("loading");
          const h3 = el("h3");
          const row = el("span", "render-row");
          row.appendChild(el("span", "spinner"));
          row.appendChild(document.createTextNode(name));
          h3.appendChild(row);
          card.replaceChildren(h3, el("div", "diff-placeholder", "computing…"));
        };
        const failCard = (card, name, error) => {
          resetCard(card, name);
          card.classList.add("failed");
          card.appendChild(
            el("div", "diff-placeholder", error?.message || String(error)),
          );
        };
        const fillCard = (card, name, res, dt) => {
          resetCard(card, name);
          if (res.diffPixels) {
            const cv = createCanvas(a.width, a.height, dpr);
            cv.getContext("2d").putImageData(
              new ImageData(res.diffPixels, a.width, a.height),
              0,
              0,
            );
            card.appendChild(wrapCanvas(cv));
          } else if (res.diffURL) {
            const img = document.createElement("img");
            img.src = res.diffURL;
            img.className = "diff-image";
            setDisplaySize(img, a.width, a.height, dpr);
            card.appendChild(img);
          } else {
            card.appendChild(el("div", "ssim-readout", res.label));
          }
          card.appendChild(el("div", "", `${res.label} · ${dt.toFixed(0)} ms`));
        };

        const wasmDiffNames = DIFF_WASMS;
        const allNames = [...COMPARATORS.map((c) => c.name), ...wasmDiffNames];
        const cards = allNames.map((name) => {
          const c = el("div", "diff");
          loadingCard(c, name);
          row.appendChild(c);
          return c;
        });

        const pairLabel = `${rendererLabel(compareA)} ↔ ${rendererLabel(compareB)}`;
        // Visual progress bar inside the pair header, plus matching text in
        // the status pill. Insert ahead of the cards row so it sits directly
        // under the h2.
        const progress = el("div", "diff-progress");
        const progressFill = el("div", "diff-progress-fill");
        progress.appendChild(progressFill);
        pair.insertBefore(progress, row);

        let diffDoneCount = 0;
        const bumpDiffStatus = () => {
          diffDoneCount++;
          if (staleDiff(myGen, myDiffGen)) return;
          const pct = (diffDoneCount / allNames.length) * 100;
          progressFill.style.width = `${pct}%`;
          if (diffDoneCount >= allNames.length) {
            progress.classList.add("done");
          }
          setStatus(
            diffDoneCount < allNames.length
              ? `diffing ${pairLabel}: ${diffDoneCount}/${allNames.length} done`
              : `${pairLabel}: ${allNames.length} diff${allNames.length === 1 ? "" : "s"} ready`,
          );
        };
        setStatus(`diffing ${pairLabel}: 0/${allNames.length} done`);

        // Let the browser paint the skeleton cards before the synchronous
        // JS comparators (pixelmatch / ssim.js / resemble) start blocking
        // the main thread — otherwise the loading state never shows.
        await new Promise((r) =>
          requestAnimationFrame(() => requestAnimationFrame(r)),
        );
        if (staleDiff(myGen, myDiffGen)) return;

        // JS comparators are CPU-bound on the main thread. Run them
        // serially with a frame yield before each so the progress bar
        // advances and each skeleton card has time to paint before its
        // comparator blocks the thread.
        const mainPromise = (async () => {
          for (let idx = 0; idx < COMPARATORS.length; idx++) {
            const cmp = COMPARATORS[idx];
            const card = cards[idx];
            await new Promise((r) => requestAnimationFrame(r));
            if (staleDiff(myGen, myDiffGen)) return;
            const t0 = performance.now();
            try {
              const res = await cmp.run(a, b);
              if (staleDiff(myGen, myDiffGen)) return;
              fillCard(card, cmp.name, res, performance.now() - t0);
            } catch (e) {
              if (staleDiff(myGen, myDiffGen)) return;
              failCard(card, cmp.name, e);
            } finally {
              bumpDiffStatus();
            }
          }
        })();

        // wasm diffs run in their own workers — fan out one call each so
        // the progress bar advances per diff instead of in one batch at
        // the end.
        const cloneImg = (i) => ({
          renderer: i.renderer,
          width: i.width,
          height: i.height,
          data: new Uint8ClampedArray(i.data),
        });
        const wasmPromises = wasmDiffNames.map(async (name) => {
          const idx = allNames.indexOf(name);
          if (idx < 0) return;
          const card = cards[idx];
          const aCopy = cloneImg(a);
          const bCopy = cloneImg(b);
          const t0 = performance.now();
          try {
            const r = await diffWorkers[name].call(
              "diff",
              { a: aCopy, b: bCopy },
              [aCopy.data.buffer, bCopy.data.buffer],
            );
            if (staleDiff(myGen, myDiffGen)) return;
            fillCard(card, name, r, r.time ?? performance.now() - t0);
          } catch (e) {
            if (staleDiff(myGen, myDiffGen)) return;
            failCard(card, name, e);
          } finally {
            bumpDiffStatus();
          }
        });

        await Promise.all([mainPromise, ...wasmPromises]);
      };

      let pdfBytes = null;

      // Generation counters discard stale async render/diff work.
      let renderGen = 0;
      let diffGen = 0;
      let lastRender = null;
      let pageSizePtCache = new Map();
      let autoDpi = true;
      const stale = (gen) => gen !== renderGen;
      const staleDiff = (gen, diff) => stale(gen) || diff !== diffGen;

      const renderSelectedDiff = async () => {
        if (!lastRender || stale(lastRender.renderGen)) {
          dom.diffs.replaceChildren();
          return;
        }
        const myDiffGen = ++diffGen;
        await renderDiffs(
          lastRender.images,
          lastRender.dpr,
          lastRender.renderGen,
          myDiffGen,
          dom.compareA.value,
          dom.compareB.value,
        );
      };

      const getPageSizePt = async (pageNumber, sourcePdfBytes) => {
        if (pageSizePtCache.has(pageNumber)) {
          return pageSizePtCache.get(pageNumber);
        }

        const dataCopy = sourcePdfBytes.slice();
        const { doc, loadingTask } = await openPdfjsDocument(dataCopy);
        try {
          const pdfPage = await doc.getPage(pageNumber);
          const viewport = pdfPage.getViewport({ scale: 1 });
          const size = { width: viewport.width, height: viewport.height };
          pageSizePtCache.set(pageNumber, size);
          return size;
        } finally {
          await destroyPdfjsDocument(doc, loadingTask);
        }
      };

      const updateAutoDpi = async (
        pageNumber,
        rendererCount,
        sourcePdfBytes,
      ) => {
        if (!autoDpi || !pdfBytes || rendererCount <= 0) {
          return;
        }

        const pageSize = await getPageSizePt(pageNumber, sourcePdfBytes);
        if (pdfBytes !== sourcePdfBytes) {
          return;
        }
        if (!Number.isFinite(pageSize.width) || pageSize.width <= 0) {
          return;
        }

        const renderStyle = getComputedStyle(dom.renders);
        const gap =
          parseFloat(renderStyle.columnGap || renderStyle.gap || "0") || 0;
        const borderPx = 2;
        const available =
          dom.renders.clientWidth ||
          dom.renders.getBoundingClientRect().width ||
          document.documentElement.clientWidth;
        const usable =
          available -
          gap * Math.max(0, rendererCount - 1) -
          borderPx * rendererCount;
        const targetCssWidth = Math.max(
          1,
          Math.floor(usable / rendererCount) - 2,
        );
        const dpi = Math.max(
          1,
          Math.min(300, Math.floor((targetCssWidth * 72) / pageSize.width)),
        );
        dom.dpi.value = String(dpi);
      };

      const selectedRendererGroups = () => {
        const groups = {
          all: [],
          cli: [],
          icepdf: false,
          pdfbox: false,
          pdfjs: false,
          wasm: [],
        };
        for (const cb of $$(".renderer:checked")) {
          const name = cb.value;
          groups.all.push(name);
          if (name === "pdfjs") groups.pdfjs = true;
          else if (name === "pdfbox") groups.pdfbox = true;
          else if (name === "icepdf") groups.icepdf = true;
          else if (CLI_RENDERERS.includes(name)) groups.cli.push(name);
          else groups.wasm.push(name);
        }
        return groups;
      };

      const drawRenderedImage = (img, dpr) => {
        const canvas = createCanvas(img.width, img.height, dpr);
        const ctx = canvas.getContext("2d");
        if (img.bitmap) {
          ctx.drawImage(img.bitmap, 0, 0);
          img.bitmap.close?.();
          delete img.bitmap;
        } else if (img.data) {
          ctx.putImageData(
            new ImageData(img.data, img.width, img.height),
            0,
            0,
          );
        }
        return canvas;
      };

      const appendRenderedImage = ({ img, result, dpr, page, wanted, gen }) => {
        if (stale(gen) || !img) return;

        result.images.push(img);
        result.page_width_pt ??= img.page_width_pt;
        result.page_height_pt ??= img.page_height_pt;

        fillRenderSlot(
          img.renderer,
          `${img.renderer} — ${img.renderTime.toFixed(0)} ms`,
          drawRenderedImage(img, dpr),
        );

        const got = result.images.map((rendered) => rendered.renderer);
        const remaining = wanted.length - got.length;
        setStatus(
          remaining > 0
            ? `rendering page ${page}: ${got.length}/${wanted.length} ready — ${rendererSummary(result.images)}`
            : `page ${page}: ${rendererSummary(result.images)}`,
        );
      };

      const timedRender = async (name, render, appendImage) => {
        const start = performance.now();
        try {
          const img = await render();
          appendImage({
            ...img,
            renderer: name,
            renderTime: performance.now() - start,
          });
        } catch (e) {
          console.error(`${name} render error:`, e);
          failRenderSlot(name, e);
        }
      };

      const renderWorkerImage = (
        name,
        workerPromise,
        sourcePdfBytes,
        payload,
        appendImage,
      ) =>
        timedRender(
          name,
          async () => {
            // `workerPromise` may be a Promise (cache-busted spawning is
            // async because it depends on artifactVersion fetch) or an
            // already-resolved worker handle. Awaiting both is fine.
            const worker = await workerPromise;
            const copy = sourcePdfBytes.slice();
            return worker.call("render", { ...payload, pdfBytes: copy }, [
              copy.buffer,
            ]);
          },
          appendImage,
        );

      // Diff workers start eagerly; renderer workers remain lazy. Update
      // the status pill as each one resolves so the user sees concrete
      // progress instead of a stuck "loading wasm…".
      setStatus(`loading diff engines (0/${DIFF_WASMS.length})…`);
      let diffReadyCount = 0;
      const diffReady = await Promise.allSettled(
        DIFF_WASMS.map((name) =>
          diffWorkers[name].ready.finally(() => {
            diffReadyCount++;
            setStatus(
              `loading diff engines (${diffReadyCount}/${DIFF_WASMS.length})…`,
            );
          }),
        ),
      );
      const failedDiffs = diffReady
        .map((result, index) =>
          result.status === "rejected" ? DIFF_WASMS[index] : null,
        )
        .filter(Boolean);
      dom.file.disabled = false;
      if (failedDiffs.length) {
        setStatus(
          `ready — pick a PDF (diff unavailable: ${failedDiffs.join(", ")})`,
        );
      } else {
        setStatus("ready — pick a PDF");
      }

      const loadPdfFile = async (file) => {
        if (!file) return;
        const isPdf =
          file.type === "application/pdf" ||
          file.name.toLowerCase().endsWith(".pdf");
        if (!isPdf) {
          setStatus(`not a PDF: ${file.name}`, true);
          return;
        }
        let bytes;
        try {
          bytes = new Uint8Array(await file.arrayBuffer());
        } catch (err) {
          setStatus(`could not read ${file.name}: ${errorMessage(err)}`, true);
          return;
        }
        pdfBytes = bytes;
        renderGen++;
        lastRender = null;
        pageSizePtCache = new Map();
        autoDpi = true;
        diffGen++;
        clearOutput();
        setStatus(`loading ${file.name}…`);
        let n = 0;
        try {
          n = await getPdfjsPageCount(bytes);
        } catch (err) {
          if (pdfBytes !== bytes) {
            return;
          }
          dom.pages.textContent = "";
          pdfBytes = null;
          setStatus(`could not parse ${file.name}: ${errorMessage(err)}`, true);
          return;
        }
        if (pdfBytes !== bytes) {
          return;
        }
        if (n <= 0) {
          dom.pages.textContent = "";
          pdfBytes = null;
          setStatus(`could not parse ${file.name}`, true);
          return;
        }
        dom.pages.textContent = `(of ${n})`;
        dom.page.max = n;
        if (parseInt(dom.page.value, 10) > n) dom.page.value = "1";
        setStatus(`${file.name} — ${n} page${n === 1 ? "" : "s"}`);
        doRender();
      };

      dom.file.addEventListener("change", async (e) => {
        await loadPdfFile(e.target.files?.[0]);
        e.target.value = "";
      });

      const isFileDrag = (event) =>
        Array.from(event.dataTransfer?.types || []).includes("Files");
      const droppedFile = (event) =>
        Array.from(event.dataTransfer?.files || []).find(
          (file) =>
            file.type === "application/pdf" ||
            file.name.toLowerCase().endsWith(".pdf"),
        ) || event.dataTransfer?.files?.[0];

      let dragDepth = 0;
      const resetDrag = () => {
        dragDepth = 0;
        document.body.classList.remove("drag-over");
      };
      document.addEventListener("dragenter", (event) => {
        if (!isFileDrag(event)) return;
        event.preventDefault();
        dragDepth++;
        document.body.classList.add("drag-over");
      });
      document.addEventListener("dragover", (event) => {
        if (!isFileDrag(event)) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "copy";
      });
      document.addEventListener("dragleave", (event) => {
        if (!isFileDrag(event)) return;
        dragDepth = Math.max(0, dragDepth - 1);
        if (!dragDepth) {
          resetDrag();
        }
      });
      document.addEventListener("drop", async (event) => {
        if (!isFileDrag(event)) return;
        event.preventDefault();
        resetDrag();
        await loadPdfFile(droppedFile(event));
      });
      window.addEventListener("dragend", resetDrag);
      window.addEventListener("blur", resetDrag);

      // Render-affecting inputs rerasterize; comparison inputs only rediff.
      for (const input of [dom.page, dom.antialias, dom.transparent]) {
        input.addEventListener("change", () => doRender());
      }
      dom.dpi.addEventListener("change", () => {
        autoDpi = false;
        doRender();
      });
      for (const input of [dom.compareA, dom.compareB]) {
        input.addEventListener("change", () => renderSelectedDiff());
      }
      for (const cb of $$(".renderer")) {
        cb.addEventListener("change", () => doRender());
      }

      async function doRender() {
        if (!pdfBytes) return;
        const sourcePdfBytes = pdfBytes;
        const gen = ++renderGen;
        const page = parseInt(dom.page.value, 10) || 1;
        const antialias = dom.antialias.checked ? 1 : 0;
        const transparent = dom.transparent.checked ? 1 : 0;
        const selected = selectedRendererGroups();

        if (!selected.all.length) {
          setStatus("pick at least one renderer", true);
          return;
        }

        await updateAutoDpi(page, selected.all.length, sourcePdfBytes);
        if (stale(gen)) return;

        const dpi = parseFloat(dom.dpi.value) || 96;

        // Keep canvases crisp on high-DPI displays.
        const dpr = window.devicePixelRatio || 1;
        const renderDpi = dpi * dpr;

        const t0 = performance.now();
        const result = { resolution: dpi, images: [] };
        clearOutput();
        createRenderSlots(selected.all);
        setStatus(
          `rendering page ${page}: 0/${selected.all.length} ready (${selected.all.join(", ")})`,
        );

        const appendImage = (img) =>
          appendRenderedImage({
            img,
            result,
            dpr,
            page,
            wanted: selected.all,
            gen,
          });

        const commonPayload = { page, dpi: renderDpi, transparent };
        const antialiasPayload = { ...commonPayload, antialias };
        const renderTasks = [
          ...selected.wasm.map((name) =>
            renderWorkerImage(
              name,
              getRendererWorker(name),
              sourcePdfBytes,
              antialiasPayload,
              appendImage,
            ),
          ),
          ...selected.cli.map((name) =>
            renderWorkerImage(
              name,
              getCliRendererWorker(name),
              sourcePdfBytes,
              antialiasPayload,
              appendImage,
            ),
          ),
        ];

        if (selected.pdfjs) {
          renderTasks.push(
            timedRender(
              "pdfjs",
              () => renderPdfjs(sourcePdfBytes, page, renderDpi, !!transparent),
              appendImage,
            ),
          );
        }

        if (selected.pdfbox) {
          renderTasks.push(
            renderWorkerImage(
              "pdfbox",
              getPdfboxWorker(),
              sourcePdfBytes,
              commonPayload,
              appendImage,
            ),
          );
        }

        if (selected.icepdf) {
          renderTasks.push(
            renderWorkerImage(
              "icepdf",
              getIcepdfWorker(),
              sourcePdfBytes,
              commonPayload,
              appendImage,
            ),
          );
        }

        await Promise.allSettled(renderTasks);
        if (stale(gen)) return;

        const dt = performance.now() - t0;
        const got = result.images.map((i) => i.renderer);
        const missing = selected.all.filter((name) => !got.includes(name));
        if (missing.length) {
          setStatus(
            `render failed for: ${missing.join(", ")} (got: ${got.join(", ") || "none"})`,
            true,
          );
        } else {
          const dims = `${result.page_width_pt?.toFixed(1)}×${result.page_height_pt?.toFixed(1)} pt`;
          setStatus(
            `page ${page}: ${dims} → ` +
              rendererSummary(result.images) +
              ` @ ${renderDpi.toFixed(0)} DPI (dpr ${dpr.toFixed(2)}) in ${dt.toFixed(0)} ms`,
          );
        }

        lastRender = { images: result.images, dpr, renderGen: gen };
        await renderSelectedDiff();
      }
    </script>
  </body>
</html>
