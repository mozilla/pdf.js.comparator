events {}

http {
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;

  gzip on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/javascript application/json application/wasm
             application/java-archive text/css text/plain;

  types {
    text/html html htm;
    text/css css;
    text/plain txt text;
    application/javascript js mjs;
    application/json json map;
    application/wasm wasm;
    application/java-archive jar;
    font/ttf ttf;
    application/x-font-type1 pfb;
  }

  server {
    listen 8000;
    root /www;
    index index.html;

    # COOP/COEP unlock SharedArrayBuffer + cross-origin isolated context.
    # No current renderer uses threads, but setting these now means a future
    # -pthread build wouldn't have to revisit the deploy story.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Build artifacts under /out/<renderer>/ change only when the publishing
    # workflow updates the per-renderer source.json — cache them heavily so
    # repeat visits don't redownload megabytes of wasm. The harness/index
    # files at the root must stay no-store so a deploy is immediately live.
    location ~ ^/out/ {
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Cache-Control "public, max-age=86400, must-revalidate" always;
      try_files $uri =404;
    }

    location ~ ^/workers/ {
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      add_header Cross-Origin-Embedder-Policy "require-corp" always;
      add_header Cross-Origin-Resource-Policy "same-origin" always;
      add_header Cache-Control "public, max-age=300" always;
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-store" always;
      try_files $uri $uri/ =404;
    }
  }
}
